name: Coletar Clima Pedal Rio

# Dois momentos por dia, um workflow só:
#   • ~20h30 BRT → modo "clima":      buscar_clima.py → config/clima-amanha.json (a Routine lê às 21h)
#   • ~03h15 BRT → modo "madrugada":  atualizar_madrugada.py → docs/atualizacao.json (a página mostra)
# Gatilho PRINCIPAL é o cron-job.org (chama workflow_dispatch nesses dois horários).
# Os crons abaixo são só BACKUP — o cron nativo do GitHub atrasa ~1h de forma consistente.
# Se a Open-Meteo não responder, o último passo dispara nova execução (outro
# runner), até 3 tentativas — ver "Conferir Open-Meteo" (16/11/2026).

on:
  schedule:
    - cron: '45 22 * * *'   # 19h45 BRT (+~1h de atraso ≈ 20h45) — backup do coletor
    - cron: '45 5 * * *'    # 02h45 BRT (+~1h de atraso ≈ 03h45) — backup da madrugada
  workflow_dispatch:
    inputs:
      modo:
        description: 'auto = decide pela hora BRT (0h–6h → madrugada; resto → clima)'
        type: choice
        options: [auto, clima, madrugada]
        default: auto
      tentativa:
        description: 'uso interno — nº da tentativa (o próprio workflow redispara se a Open-Meteo não responder)'
        type: string
        default: '1'

permissions:
  contents: write
  actions: write     # para redisparar este workflow quando a Open-Meteo não responde

# Nunca dois pushes ao mesmo tempo (cron-job.org + backup podem coincidir)
concurrency:
  group: pedal-rio-commits
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decidir modo
        id: modo
        run: |
          MODO="${{ github.event.inputs.modo || 'auto' }}"
          H=$(TZ=America/Sao_Paulo date +%-H)
          if [ "$MODO" = "auto" ]; then
            if [ "$H" -lt 7 ]; then MODO=madrugada; else MODO=clima; fi
          fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODO — agora são $(TZ=America/Sao_Paulo date '+%H:%M') BRT"

      - name: Coletar clima de amanhã (Open-Meteo, 5 modelos)
        if: steps.modo.outputs.modo == 'clima'
        run: python buscar_clima.py

      - name: Atualização da madrugada (Open-Meteo agora + Alerta Rio)
        if: steps.modo.outputs.modo == 'madrugada'
        run: python atualizar_madrugada.py

      - name: Commit e push
        run: |
          git config user.name "Pedal Rio Bot"
          git config user.email "bot@pedalrio.local"
          for f in config/clima-amanha.json docs/atualizacao.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Nada mudou."; exit 0
          fi
          if [ "${{ steps.modo.outputs.modo }}" = "madrugada" ]; then
            git commit -m "Atualização da madrugada [automático]"
          else
            git commit -m "Clima atualizado [automático]"
          fi
          git pull --rebase origin main
          git push

      # Sem Open-Meteo nesta execução (todos os pontos falharam, ou o arquivo não
      # é do dia certo) → espera 60 s e dispara outra execução, que cai em outro
      # runner. Até 3 tentativas. A execução sem Open-Meteo termina com erro
      # (fica vermelha no Actions) — antes ela saía "success" e ninguém sabia.
      - name: Conferir Open-Meteo (sem resposta → nova tentativa, até 3)
        if: always() && steps.modo.outputs.modo != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ steps.modo.outputs.modo }}
          TENTATIVA: ${{ github.event.inputs.tentativa || '1' }}
        run: |
          if python3 - <<'PY'
          import json, os, sys, datetime, zoneinfo
          hoje = datetime.datetime.now(zoneinfo.ZoneInfo("America/Sao_Paulo")).date()
          try:
              if os.environ["MODO"] == "madrugada":
                  d = json.load(open("docs/atualizacao.json", encoding="utf-8"))
                  ok = d.get("data_alvo") == hoje.isoformat() and d.get("fontes", {}).get("open_meteo") is True
              else:
                  d = json.load(open("config/clima-amanha.json", encoding="utf-8"))
                  amanha = (hoje + datetime.timedelta(days=1)).isoformat()
                  ok = d.get("data_alvo") == amanha and any(p.get("ok") for p in d.get("pontos", {}).values())
          except Exception as e:
              print("Nao consegui ler o arquivo:", e)
              ok = False
          print("Open-Meteo OK." if ok else "Open-Meteo NAO respondeu nesta execucao.")
          sys.exit(0 if ok else 1)
          PY
          then exit 0; fi
          if [ "$TENTATIVA" -lt 3 ]; then
            PROX=$((TENTATIVA + 1))
            echo "Aguardando 60 s e disparando a tentativa $PROX de 3 (novo runner)..."
            sleep 60
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/clima.yml/dispatches" \
              -f ref=main -f "inputs[modo]=$MODO" -f "inputs[tentativa]=$PROX"
          else
            echo "3 tentativas sem Open-Meteo. Fim — a Routine e a página vão mostrar o aviso."
          fi
          exit 1
